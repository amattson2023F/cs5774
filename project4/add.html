<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Choose a Sprite and record whether it is mastered.">
    <title>SpriteDex</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/detail.css">
    <link rel="stylesheet" href="css/add.css">
    <script src="https://unpkg.com/pocketbase@0.26.2/dist/pocketbase.umd.js" defer></script>
    <script src="js/pocketbase-client.js" defer></script>
    <script src="js/jquery-3.7.1.min.js" defer></script>
    <script src="js/scripts.js?v=phase6-notes" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="homealt.html" aria-label="SpriteDex home">SpriteDex</a>
            <nav class="primary-nav" aria-label="Primary navigation">
                <a href="index.html">Home</a>
                <a href="list.html">My Collection</a>
            </nav>
            <form class="site-search" action="search.html" method="get" role="search" aria-label="Search SpriteDex">
                <label class="visually-hidden" for="site-search-q">Search SpriteDex</label>
                <input type="search" id="site-search-q" name="q" placeholder="Try adventure sprite">
                <button class="button button-dark" type="submit">Search</button>
            </form>
            <div class="account-actions">
      <a class="button" href="index.html">Log Out</a>
            </div>
        </div>
    </header>
    <main class="container add-page" id="main">
        <p><a href="list.html">← Back to My Collection</a></p>
        <h1>Add Sprite to My Collection</h1>
        <p>Choose a Sprite and start tracking your progress.</p>
        <div class="add-layout">

            <form class="detail-form add-form" id="add-to-collection-form" aria-label="Add a Sprite to your collection">
                <div class="detail-field">
                    <label for="sprite">Select Sprite (required)</label>
                    <select id="sprite" name="sprite" required>
                        <option value="" disabled selected>Loading sprites…</option>
                    </select>
                </div>
                <fieldset class="status-options">
                    <legend>Status (required)</legend>
                    <div class="status-choices">
                        <label for="not-mastered"><input type="radio" id="not-mastered" name="status" value="not-mastered" required checked>Not Mastered</label>
                        <label for="mastered"><input type="radio" id="mastered" name="status" value="mastered" required>Mastered</label>
                    </div>
                </fieldset>
                <div class="detail-field">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="4" placeholder="Add notes about this Sprite."></textarea>
                </div>
                <div class="detail-actions">
                    <p class="add-form-status" role="status" aria-live="polite"></p>
                    <button class="button button-dark" id="add-to-collection-button" type="submit">Add to My Collection</button>
                    <a class="button" href="list.html">Cancel</a>
                </div>
            </form>

            <aside class="sprite-preview" aria-labelledby="preview-title">
                <h2 id="preview-title">Sprite Preview</h2>

                <img class="sprite-portrait" alt="Selected Sprite">
                <h3 class="preview-name">Select a Sprite</h3>
                <ul class="tags" aria-label="Sprite attributes">
                    <li class="preview-rarity"></li>
                    <li class="preview-season"></li>
                </ul>
                <h3>About This Sprite</h3>
                <p class="preview-description">Sprite details will appear here.</p>
            </aside>
        </div>
    </main>
    <footer class="site-footer">
        <p class="container">© 2026 SpriteDex</p>
    </footer>
</body>
</html>
