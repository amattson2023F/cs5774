<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="View your owned Sprites and track collection mastery.">
    <title>SpriteDex</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/list.css">
    <script src="https://unpkg.com/pocketbase@0.26.2/dist/pocketbase.umd.js" defer></script>
    <script src="js/pocketbase-client.js" defer></script>
    <script src="js/jquery-3.7.1.min.js" defer></script>
    <script src="js/scripts.js?v=phase7" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="homealt.html" aria-label="SpriteDex home">SpriteDex</a>
            <nav class="primary-nav" aria-label="Primary navigation">
                <a href="index.html">Home</a>
                <a href="list.html" aria-current="page">My Collection</a>
            </nav>
            <form class="site-search" action="search.html" method="get" role="search" aria-label="Search SpriteDex">
                <label class="visually-hidden" for="site-search-q">Search SpriteDex</label>
                <input type="search" id="site-search-q" name="q" placeholder="Try adventure sprite">
                <button class="button button-dark" type="submit">Search</button>
            </form>
            <div class="account-actions">
      <a class="button" href="index.html">Log Out</a>
            </div>
        </div>
    </header>
    <main class="container collection" id="main" data-pocketbase-collection-page>
        <div class="section-heading">
            <div>
                <h1>My Collection</h1>
                <p>Track your owned Sprites and see what's left to master.</p>
            </div>
            <a class="button button-dark" href="add.html">+ Add Sprite</a>
        </div>

        <div class="collection-summary">
            <section class="collection-stat" aria-labelledby="owned-title">
                <span class="summary-icon" aria-hidden="true">◇</span>
                <div>
                    <p><strong>0 / 0</strong></p>
                    <h2 id="owned-title">Owned</h2>
                </div>
            </section>
            <section class="collection-stat" aria-labelledby="mastered-title">
                <span class="summary-icon" aria-hidden="true">☆</span>
                <div>
                    <p><strong class="mastered-count">0 / 0</strong></p>
                    <h2 id="mastered-title">Mastered</h2>
                </div>
            </section>
        </div>

        <form class="filters collection-filters" role="search" aria-label="Search your collection">
            <div>
                <label for="collection-search">Search collection</label>
                <input type="search" id="collection-search" name="q" placeholder="Search your collection…">
            </div>
            <div>
                <label for="season">Season</label>
                <select id="season" name="season">
                    <option value="all">All Seasons</option>
                    <option value="c7mini">Chapter 7 Mini Season</option>
                </select>
            </div>
            <div>
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="all">All Statuses</option>
                    <option value="mastered">Mastered</option>
                    <option value="not-mastered">Not Mastered</option>
                </select>
            </div>
            <div>
                <label for="sort">Sort by</label>
                <select id="sort" name="sort">
                    <option value="name">Name</option>
                    <option value="mastered" selected>Mastery</option>
                    <option value="season">Season</option>
                </select>
            </div>
            <button class="button button-dark" type="button">Search</button>
        </form>

        <div class="collection-grid" data-pocketbase-collection></div>
    </main>
    <footer class="site-footer">
        <p class="container">© 2026 SpriteDex</p>
    </footer>
</body>
</html>
